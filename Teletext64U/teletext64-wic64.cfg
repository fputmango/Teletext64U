FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800; # 2KB stack
    __HIMEM__:     type = weak, value = $8000; # top of free RAM below VIC bank 2; C stack $7800-$7FFF
}
MEMORY {
    ZP:       file = "",  define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O,  define = yes, start = %S,              size = $000D;
    MAIN:     file = %O,  define = yes, start = __HEADER_LAST__, size = $8000 - __HEADER_LAST__, fill = yes, fillval = $00; # stack initialises to $7800 and grows DOWN, so code up to $7FFF is safe. fill=yes pads the file up to $8000 so OVERLAY (below) lands at the address the linker resolved calls to - without this, OVERLAY's bytes end up at the wrong file offset/address and JSR'ing into it hangs/crashes.
    BSSDATA:  file = "",               start = $C000,           size = $0F00;  # $C000-$CEFF, safe below I/O at $D000
    OVERLAY:  file = %O,               start = $8000,           size = $2000;  # $8000-$9FFF: SCREEN_RAM/SCREEN_RAM2/SCREEN_CONCEAL/SCREEN_FLASH, idle until init_bitmap_mode() runs. Stops well short of BITMAP ($A000). Holds the settings-screen + WUD load/save code (see OVLCODE/OVLRODATA below) - this build only, which is why this is a separate .cfg from teletext64.cfg (UCI/WiC64-disk don't need the overlay or the fill padding it requires).
}
SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp;
    LOADADDR:  load = LOADADDR, type = ro;
    EXEHDR:    load = HEADER,   type = ro;
    STARTUP:   load = MAIN,     type = ro;
    LOWCODE:   load = MAIN,     type = ro,  optional = yes;
    CODE:      load = MAIN,     type = ro;
    RODATA:    load = MAIN,     type = ro;
    DATA:      load = MAIN,     type = rw;
    INIT:      load = MAIN,     type = rw;
    ONCE:      load = MAIN,     type = ro,  define = yes;
    BSS:       load = BSSDATA,  type = bss, define = yes;
    OVLCODE:   load = OVERLAY,  type = ro,  optional = yes;
    OVLRODATA: load = OVERLAY,  type = ro,  optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
